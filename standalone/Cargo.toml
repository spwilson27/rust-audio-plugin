[package]
name = "standalone"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "standalone"
path = "src/lib.rs"

[[bin]]
name = "standalone"
path = "src/bin/standalone.rs"

[features]
default = ["cpal"]
cpal = ["pal/cpal"]

[dependencies]
anyhow.workspace = true
audio-core = { path = "../audio-core" }
gui = { path = "../gui" }
clap = { version = "4.5", features = ["derive"] }
debug-server = { path = "../debug-server" }
crossbeam-channel = "0.5"
pal = { path = "../pal" }
raw-window-handle.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# Platform-specific dependencies for standalone window creation
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString"] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSWindow"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
tonic = "0.12"
test-e2e = { path = "../test-e2e" }
