[package]
name = "splug"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "splug"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true
vst3-sys = { workspace = true, optional = true }
vst3-com = { path = "../extern/vst3-sys/com", optional = true }
clap-sys = { workspace = true, optional = true }

[features]
vst3 = ["dep:vst3-sys", "dep:vst3-com"]
clap = ["dep:clap-sys"]

# For catching panics at FFI boundary
# (using std::panic::catch_unwind, no additional deps needed)

[dev-dependencies]
