syntax = "proto3";
package debug_control;

service DebugControl {
    rpc SendInputEvent (InputEventMsg) returns (Ack);
    rpc ResizeWindow (ResizeMsg) returns (Ack);
    rpc CaptureScreen (Empty) returns (ImageBytes);
    
    // Widget testing RPCs
    rpc GetWidgetState (WidgetIdMsg) returns (WidgetState);
    rpc SetWidgetValue (SetWidgetValueMsg) returns (Ack);
    rpc ListWidgets (Empty) returns (WidgetList);
}

message InputEventMsg {
    oneof event {
        MouseMsg mouse = 1;
        KeyMsg key = 2;
        QuitMsg quit = 3;
        TextInputMsg text_input = 4;
    }
}

message QuitMsg {}

message MouseMsg {
    enum Type {
        DOWN = 0;
        UP = 1;
        MOVE = 2;
    }
    Type type = 1;
    float x = 2;
    float y = 3;
    uint32 button = 4;
}

message KeyMsg {
    enum Type {
        DOWN = 0;
        UP = 1;
    }
    Type type = 1;
    uint32 keycode = 2;
}

message TextInputMsg {
    string text = 1;
}

message ResizeMsg {
    uint32 width = 1;
    uint32 height = 2;
}

message Empty {}

message ImageBytes {
    bytes data = 1;
    uint32 width = 2;
    uint32 height = 3;
}


message Ack {
    bool success = 1;
}

// Widget testing messages

message WidgetIdMsg {
    uint64 widget_id = 1;
}

message SetWidgetValueMsg {
    uint64 widget_id = 1;
    double value = 2;
}

message WidgetState {
    uint64 widget_id = 1;
    string widget_type = 2;  // "Button", "Slider", "Knob", "Textbox"
    
    // Common widget properties
    bool focused = 3;
    bool enabled = 4;
    Rect bounds = 5;
    
    // Widget-specific state (use appropriate field based on widget_type)
    oneof specific_state {
        ButtonState button = 10;
        SliderState slider = 11;
        KnobState knob = 12;
        TextboxState textbox = 13;
    }
}

message Rect {
    float x = 1;
    float y = 2;
    float width = 3;
    float height = 4;
}

message ButtonState {
    string label = 1;
    string state = 2;  // "Normal", "Hovered", "Pressed"
}

message SliderState {
    double value = 1;  // [0.0, 1.0]
    string orientation = 2;  // "Horizontal", "Vertical"
    bool dragging = 3;
}

message KnobState {
    double value = 1;  // [0.0, 1.0]
    float min_angle = 2;
    float max_angle = 3;
    bool dragging = 4;
}

message TextboxState {
    string text = 1;
    uint32 cursor_pos = 2;
    bool has_selection = 3;
    string placeholder = 4;
}

message WidgetList {
    repeated WidgetState widgets = 1;
}
