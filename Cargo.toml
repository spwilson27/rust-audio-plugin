[workspace]
resolver = "2"
exclude = ["extern"]
members = [
    "audio-core",
    "plugin",
    "standalone",
    "xtask",
    "pal",
    "gui",
    "debug-server",
    "test-e2e",
    "simple-host",
    "extern/cpal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Shared dependencies across workspace
anyhow = "1.0"
prost = "0.13"
raw-window-handle = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
image = "0.24"
vst3-sys = { path = "extern/vst3-sys" }
clap-sys = { path = "extern/clap-sys" }
cpal = { path = "extern/cpal" }

[workspace.lints.rust]
warnings = "deny"
# Allow some warnings in cpal since it's external
# (Actually workspace.lints apply to workspace members, we might need to be careful if cpal has warnings)

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
