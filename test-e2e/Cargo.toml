[package]
name = "test-e2e"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "test_e2e"
path = "src/lib.rs"

[[bin]]
name = "test-e2e"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
gui = { path = "../gui" }
pal = { path = "../pal" }
debug-server = { path = "../debug-server" }
crossbeam-channel = "0.5"
tracing.workspace = true
tracing-subscriber.workspace = true
raw-window-handle.workspace = true

# Dependencies moved from dev-dependencies for library usage
tokio = { version = "1.0", features = ["full"] }
image.workspace = true
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tonic = "0.12"

# Platform-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString"] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSWindow"] }

[dev-dependencies]
# testlib = { path = "../testlib" } # Removed

