[package]
name = "gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "gui"

[dependencies]
anyhow.workspace = true
raw-window-handle.workspace = true
ash = "0.38"
ash-window = "0.13"

fontdue = "0.7"
guillotiere = "0.6"

# GUI framework will use pal and render crates
pal = { path = "../pal" }
# render = { path = "../render" } # Phase 3
arboard = "3.4" # Cross-platform clipboard support
tracing.workspace = true
image.workspace = true
[dev-dependencies]
audio-core = { path = "../audio-core" }
debug-server = { path = "../debug-server" }
clap = { version = "4.5", features = ["derive"] }
standalone = { path = "../standalone" }
tracing-subscriber = { workspace = true }
crossbeam-channel = "0.5"
test-e2e = { path = "../test-e2e" }
tokio = { version = "1.0", features = ["full"] }
